[project]
name = "cv-service"
version = "0.1.0"
description = "Project-DR video capture + processing: people counts per camera for the coordinator dashboard"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "opencv-python>=4.10",
    "ultralytics>=8.3",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "numpy>=1.26",
    "lap>=0.5.12",
]

[project.scripts]
cv-service = "cv_service.main:main"

[dependency-groups]
dev = ["pytest>=8.3", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cv_service"]

[tool.pytest.ini_options]
testpaths = ["tests"]

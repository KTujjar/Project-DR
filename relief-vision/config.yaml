# Copy/edit. Anything omitted falls back to the defaults in reliefvision/config.py.
site_id: demo-site
process_fps: 8          # frames analysed per second (5-10 is plenty)
emit_interval_s: 2.0    # one Event per camera every N seconds
device: null            # null = auto; or "cpu", "cuda:0", "mps"

person:
  weights: yolo11n.pt   # try yolo11s.pt / yolo11m.pt for accuracy, raise imgsz to 960 for small/far people
  conf: 0.35
  imgsz: 640

aids:                   # wheelchairs / walkers / crutches / canes / strollers (open-vocabulary, noisy)
  enabled: true
  weights: yolov8s-worldv2.pt
  conf: 0.25
  interval_s: 1.5

grid: {rows: 6, cols: 8, cell_capacity: 3}   # cell_capacity = people that make one grid cell "full"

events:
  jsonl: events.jsonl
  webhook: null         # e.g. http://localhost:8000/events  (buffered in outbox.sqlite if offline)

cameras:
  - id: cam1
    source: 0                      # 0 = webcam | file.mp4 | rtsp://... | ros2:/camera/image_raw/compressed?odom=/odom
    mode: auto                     # auto | fixed | mobile
  # - id: robot
  #   source: "ros2:/camera/image_raw/compressed?odom=/odom"
  #   mode: auto
  #   pose: east-gate              # optional label copied into every event
  # - id: cam_s1                   # coordinator dashboard camera id
  #   site_id: shelter_1           # optional: dashboard location (defaults to the top-level site_id)
  #   source: push                 # iPhone sends frames from the /phone page (needs --serve)
  # - id: cam_shannon                # TurtleBot3 camera via rescue-bot Mission Control (README "TurtleBot3 camera")
  #   site_id: shelter_3
  #   source: "turtlebot:http://127.0.0.1:8872"
  #   token_file: /path/to/rescue-bot/.robot/runtime/service.token   # never commit the token
  #   mode: auto

# Coordinator-dashboard API, used with `reliefvision --serve` (see README "Dashboard API").
# server:
#   port: 8001
#   public_url: http://localhost:8001   # base URL browsers use for video links
#   video: false                        # true = stream annotated frames (same as --serve-video)
# overlay:                              # what the streamed/dashboard video shows (see README "Heat maps")
#   heat: recent                        # recent | cumulative (same as --heat); needs video to reach the dashboard
#   heat_follow: false                  # true = heat pinned to the scene while the camera moves (--follow-camera)
# pass:                                 # people counted once per pass along a line
#   min_track_hits: 3                   # raise if one person gets counted twice
#   gap_s: 5.0                          # a pass ends after this long with nobody in view
